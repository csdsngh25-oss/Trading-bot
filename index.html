<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MemeDesk</title>
<style>
:root{--bg:#0b1210;--c:#13201b;--t:#e8f3ee;--m:#7f9a8f;--g:#2ecc8f;--r:#ff5d6c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:15px system-ui,sans-serif;padding:max(16px,env(safe-area-inset-top)) 14px 28px}
h1{font-size:18px;margin:0 0 2px}small,.m{color:var(--m)}.card{background:var(--c);border-radius:14px;padding:14px;margin:10px 0}
.big{font-size:34px;font-weight:700}.g{color:var(--g)}.r{color:var(--r)}.row{display:flex;gap:8px}.row>*{flex:1}
.k{font-size:12px;color:var(--m)}.v{font-size:18px;font-weight:600}
button{width:100%;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:600;background:var(--g);color:#04130c}
button.s{background:#24352e;color:var(--t)}input{width:100%;padding:10px;margin:4px 0 8px;border-radius:10px;border:1px solid #2a3f36;background:#0b1210;color:var(--t)}
pre{margin:0;font:11px/1.5 ui-monospace,monospace;white-space:pre-wrap;max-height:240px;overflow:auto;color:#9fd9bf}
.pos{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #1d2f27}
</style></head><body>
<h1>MemeDesk <small>PAPER ONLY - no real money</small></h1>
<div class="card"><div class="k">Paper balance</div><div class="big" id="eq">-</div><div id="pl"></div>
<div class="row" style="margin-top:10px"><div><div class="k">Scanned</div><div class="v" id="sc">0</div></div>
<div><div class="k">Passed</div><div class="v" id="ps">0</div></div>
<div><div class="k">Trades</div><div class="v" id="tr">0</div></div>
<div><div class="k">W / L</div><div class="v" id="wl">0/0</div></div></div></div>
<div class="row"><button id="go">Start</button><button class="s" id="rc">Send recap</button></div>
<div class="card"><b>Open positions</b><div id="op" class="m">none</div></div>
<div class="card"><b>Log</b><pre id="lg"></pre></div>
<div class="card"><b>Settings</b><div class="k">Telegram bot token</div><input id="tt" type="password">
<div class="k">Telegram chat id</div><input id="tc"><div class="k">USD to INR rate</div><input id="fx" type="number">
<div class="row"><button class="s" id="sv">Save</button><button class="s" id="rs">Reset paper account</button></div>
<p class="m" style="font-size:12px">Keep the app open and the phone charging. Android pauses apps in the background.</p></div>
<script>
const C={POS:.1,MAXO:5,LIQ:15000,VOL:20000,TOP:25,LP:90,SCORE:.6,STOP:-.08,ARM:.15,GAP:.1,HRS:6,SLIP:.03,FEE:.01,LOOP:60000};
const RUG='https://api.rugcheck.xyz/v1',DEX='https://api.dexscreener.com/latest/dex/tokens/';
const $=i=>document.getElementById(i);let run=false,S,CF;
const ls=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
CF=ls('md_cf',{tt:'',tc:'',fx:88});
const fresh=()=>({cash:100000/CF.fx,start:100000/CF.fx,open:{},closed:[],seen:[],scanned:0,passed:0,logs:[]});
S=ls('md_s',null)||fresh();
const save=()=>localStorage.setItem('md_s',JSON.stringify(S));
const inr=u=>'Rs'+Math.round(u*CF.fx).toLocaleString('en-IN');
const eqty=()=>S.cash+Object.values(S.open).reduce((a,p)=>a+p.qty*p.last,0);
async function get(u,n=2){for(let i=0;i<n;i++){try{const r=await fetch(u);if(r.ok)return await r.json()}catch(e){}await new Promise(r=>setTimeout(r,1500))}return null}
function log(m){S.logs.push(new Date().toISOString().slice(11,19)+' '+m);S.logs=S.logs.slice(-60)}
async function notify(m){log(m);if(CF.tt&&CF.tc)await get(`https://api.telegram.org/bot${CF.tt}/sendMessage?chat_id=${encodeURIComponent(CF.tc)}&text=${encodeURIComponent(m)}`,1)}
async function dex(m){const d=await get(DEX+m,1);const ps=((d&&d.pairs)||[]).filter(p=>p.chainId==='solana');
 return ps.sort((a,b)=>((b.liquidity||{}).usd||0)-((a.liquidity||{}).usd||0))[0]||null}
async function filt(m){const p=await dex(m);if(!p||!p.priceUsd)return[null,'no pair/price'];
 const liq=(p.liquidity||{}).usd||0,vol=(p.volume||{}).h1||0;
 if(liq<C.LIQ)return[null,'liquidity $'+Math.round(liq)];if(vol<C.VOL)return[null,'1h volume $'+Math.round(vol)];
 const r=await get(`${RUG}/tokens/${m}/report`);if(!r)return[null,'no rugcheck report'];const t=r.token||{};
 if(r.mintAuthority||t.mintAuthority)return[null,'mint not revoked'];if(r.freezeAuthority||t.freezeAuthority)return[null,'freeze active'];
 if(r.rugged)return[null,'flagged rugged'];if((r.risks||[]).some(k=>k.level==='danger'))return[null,'danger flag'];
 const top=(r.topHolders||[]).slice(0,10).reduce((a,h)=>a+(h.pct||0),0);if(top>C.TOP)return[null,'top10 hold '+Math.round(top)+'%'];
 const lk=(r.markets||[]).map(x=>((x.lp||{}).lpLockedPct)||0);if(!lk.length||Math.max(...lk)<C.LP)return[null,'LP not locked'];
 return[p,'ok']}
function analyst(p){const t=((p.txns||{}).h1)||{},b=t.buys||0,s=t.sells||0,ra=b/Math.max(b+s,1);
 const liq=(p.liquidity||{}).usd||0,vol=(p.volume||{}).h1||0,ch=(p.priceChange||{}).h1||0;
 return Math.round((.4*Math.min(ra/.6,1)+.3*Math.min(vol/(liq*2+1),1)+.3*(ch>0&&ch<150?1:0))*100)/100}
async function buy(p,sc){if(Object.keys(S.open).length>=C.MAXO)return;const m=p.baseToken.address,px=+p.priceUsd;
 const size=Math.min(S.cash,eqty()*C.POS);if(size<1)return;const fill=px*(1+C.SLIP+C.FEE);S.cash-=size;
 S.open[m]={sym:p.baseToken.symbol,qty:size/fill,cost:size,entry:fill,peak:px,last:px,t:Date.now()};
 await notify(`PAPER BUY ${p.baseToken.symbol} ${inr(size)} score ${sc}`)}
async function sell(m,px,why){const o=S.open[m];delete S.open[m];const pr=o.qty*px*(1-C.SLIP-C.FEE);S.cash+=pr;const pnl=pr-o.cost;
 S.closed.push({sym:o.sym,pnl,why});await notify(`PAPER SELL ${o.sym} (${why}) P&L ${inr(pnl)} (${(pnl/o.cost*100).toFixed(1)}%)`)}
async function risk(){for(const m of Object.keys(S.open)){const o=S.open[m],p=await dex(m);if(!p||!p.priceUsd)continue;
 const px=+p.priceUsd;o.last=px;o.peak=Math.max(o.peak,px);const pnl=px/o.entry-1,liq=(p.liquidity||{}).usd||0;let w=null;
 if(pnl<=C.STOP)w='stop';else if(o.peak/o.entry-1>=C.ARM&&px<=o.peak*(1-C.GAP))w='trail';
 else if(liq<C.LIQ/3)w='liquidity drain';else if(Date.now()-o.t>C.HRS*36e5)w='time stop';
 if(w)await sell(m,px,w)}}
async function tick(){await risk();const d=await get(RUG+'/stats/new_tokens');const arr=Array.isArray(d)?d:(d&&d.tokens)||[];
 const ms=arr.map(x=>x&&x.mint).filter(m=>m&&!S.seen.includes(m)).slice(0,15);
 for(const m of ms){S.seen.push(m);S.scanned++;const[p,why]=await filt(m);
  if(!p){log('FILTER killed '+m.slice(0,6)+': '+why);continue}S.passed++;
  const sc=analyst(p);if(sc<C.SCORE){log('ANALYST passed on '+p.baseToken.symbol+' '+sc);continue}await buy(p,sc)}
 S.seen=S.seen.slice(-2000);save();render()}
async function loop(){while(run){try{await tick()}catch(e){log('error: '+e.message);render()}
 for(let i=0;i<C.LOOP/1000&&run;i++)await new Promise(r=>setTimeout(r,1000))}}
const wl=()=>{try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}};
document.addEventListener('visibilitychange',()=>{if(run&&!document.hidden)wl()});
function render(){const e=eqty(),p=(e/S.start-1)*100,w=S.closed.filter(x=>x.pnl>0).length;
 $('eq').textContent=inr(e);$('pl').innerHTML=`<span class="${p>=0?'g':'r'}">${p>=0?'+':''}${p.toFixed(2)}%</span> <span class="m">since start</span>`;
 $('sc').textContent=S.scanned;$('ps').textContent=S.passed;$('tr').textContent=S.closed.length;$('wl').textContent=w+'/'+(S.closed.length-w);
 const o=Object.values(S.open);$('op').innerHTML=o.length?o.map(x=>{const q=(x.last/x.entry-1)*100;
  return`<div class="pos"><span>${x.sym}</span><span class="${q>=0?'g':'r'}">${q.toFixed(1)}%</span></div>`}).join(''):'none';
 $('lg').textContent=S.logs.slice().reverse().join('\n')||'Press Start. Most new tokens get rejected - that is the filters working.';
 $('go').textContent=run?'Stop':'Start';$('tt').value=CF.tt;$('tc').value=CF.tc;$('fx').value=CF.fx}
$('go').onclick=()=>{run=!run;if(run){wl();log('started (PAPER ONLY)');loop()}render()};
$('rc').onclick=()=>{const e=eqty(),w=S.closed.filter(x=>x.pnl>0).length;notify(`RECAP ${inr(e)} (${((e/S.start-1)*100).toFixed(1)}%) closed ${S.closed.length} W${w}/L${S.closed.length-w} open ${Object.keys(S.open).length}`).then(()=>{save();render()})};
$('sv').onclick=()=>{CF={tt:$('tt').value.trim(),tc:$('tc').value.trim(),fx:+$('fx').value||88};localStorage.setItem('md_cf',JSON.stringify(CF));log('settings saved');render()};
$('rs').onclick=()=>{if(confirm('Reset paper account?')){S=fresh();save();render()}};
render();
</script></body></html>
